name: Build and deploy

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - mongodb/**
      - .github/workflows/build-and-deploy.yml

permissions:
  contents: write

concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Docker Hub secrets are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Add the DOCKERHUB_USERNAME Actions secret."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Add the DOCKERHUB_TOKEN Actions secret."; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: docker.io/saurabhkumbhar7/bikes-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: docker.io/saurabhkumbhar7/bikes-frontend:${{ github.sha }}
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push MongoDB
        uses: docker/build-push-action@v6
        with:
          context: ./mongodb
          push: true
          tags: docker.io/saurabhkumbhar7/bikes-mongodb:${{ github.sha }}
          cache-from: type=gha,scope=mongodb
          cache-to: type=gha,mode=max,scope=mongodb

      - name: Update image tags for Argo CD
        uses: mikefarah/yq@v4.44.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          cmd: |
              yq -i '(.images[] | select(.name == "docker.io/saurabhkumbhar7/bikes-backend").newTag) = strenv(IMAGE_TAG)' k8s/base/kustomization.yaml
              yq -i '(.images[] | select(.name == "docker.io/saurabhkumbhar7/bikes-frontend").newTag) = strenv(IMAGE_TAG)' k8s/base/kustomization.yaml
              yq -i '(.images[] | select(.name == "docker.io/saurabhkumbhar7/bikes-mongodb").newTag) = strenv(IMAGE_TAG)' k8s/base/kustomization.yaml

      - name: Commit image tags for Argo CD
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image tags are already up to date."
            exit 0
          fi
          git commit -m "Deploy images ${IMAGE_TAG}"
          git push origin HEAD:main