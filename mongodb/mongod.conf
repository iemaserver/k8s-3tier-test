# MongoDB server configuration
# Docs: https://www.mongodb.com/docs/manual/reference/configuration-options/

storage:
  dbPath: /data/db

net:
  port: 27017
  bindIpAll: true          # reachable from other containers on the Docker network

security:
  authorization: enabled   # require username/password

operationProfiling:
  slowOpThresholdMs: 200

# Logs go to stdout so `docker logs` shows them
