apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: docker.io/saurabhkumbhar7/bikes-mongodb:v1
          imagePullPolicy: IfNotPresent
          args:
            - mongod
            - --config
            - /etc/mongo/mongod.conf
          ports:
            - name: mongo
              containerPort: 27017
          envFrom:
            - secretRef:
                name: bikes-secrets
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          startupProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 20
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi