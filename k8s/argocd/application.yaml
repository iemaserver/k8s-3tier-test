apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bikes-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iemaserver/k8s-3tier-test.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: bikes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true